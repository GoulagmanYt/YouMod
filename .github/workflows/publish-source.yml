name: Publish SideStore source

# When "Build IPA with tweaks" succeeds: publishes the release (ipa.yml creates it as a draft)
# then regenerates source.json on the "sidestore" branch.
# Source URL:
#   https://raw.githubusercontent.com/<your-user>/YouMod/sidestore/source.json

on:
  workflow_run:
    workflows: ["Build IPA with tweaks"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. youmod-ipa42)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-source
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || format('youmod-ipa{0}', github.event.workflow_run.run_number) }}
    steps:
      - name: Publish the draft release
        run: |
          set -euo pipefail
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                 --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -n1)
          test -n "$ID" || { echo "::error::Release $TAG not found"; exit 1; }
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" \
            -F draft=false -f make_latest=true > release.json

      - name: Delete previous releases
        run: |
          set -euo pipefail
          echo "Keeping target release: $TAG"
          RELEASES=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate)
          
          # Delete all older releases (drafts and published)
          echo "$RELEASES" | jq -r ".[] | select(.tag_name != \"$TAG\") | .id" | while read -r id; do
            [ -n "$id" ] || continue
            echo "Deleting release ID: $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" || true
          done

          # Delete leftover git tags for those releases
          echo "$RELEASES" | jq -r ".[] | select(.tag_name != \"$TAG\") | .tag_name" | while read -r tag; do
            [ -n "$tag" ] || continue
            echo "Deleting git tag: $tag"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" 2>/dev/null || true
          done

      - name: Prepare sidestore branch
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone --quiet --depth=1 --branch sidestore "$REMOTE" out 2>/dev/null; then
            mkdir out
            git -C out init --quiet -b sidestore
            git -C out remote add origin "$REMOTE"
          fi

      - name: Generate source.json
        run: |
          python3 - <<'PY'
          import json, os, re
          from urllib.parse import quote

          repo = os.environ["GITHUB_REPOSITORY"]
          owner = repo.split("/")[0]
          rel = json.load(open("release.json"))

          asset = next(a for a in rel["assets"] if a["name"].endswith(".ipa"))
          m = re.match(r"YouMod_(?P<yt>\S+?)_v(?P<ym>\S+)\s+\((?P<run>\d+)\)\s*$", rel.get("name") or "")
          if m:
              yt, ym, run = m["yt"], m["ym"], m["run"]
          else:
              yt, ym, run = "0", "0", str(rel["id"])

          # YouTube + build run number: matches the CFBundleShortVersionString stamped by cyan in ipa.yml (-v "${YT_VERSION}.${GITHUB_RUN_NUMBER}"),
          # so SideStore detects updates and clears the update badge once installed.
          version = f"{yt}.{run}"
          url = f"https://github.com/{repo}/releases/download/{quote(rel['tag_name'])}/{quote(asset['name'])}"
          date = rel["published_at"][:10]
          desc = f"YouTube {yt} + YouMod {ym}"

          app = {
              "name": "YouTube (YouMod)",
              "bundleIdentifier": "com.google.ios.youtube",
              "developerName": owner,
              "subtitle": "YouTube + YouMod",
              "localizedDescription": desc,
              "iconURL": f"https://raw.githubusercontent.com/{repo}/HEAD/Icon.png",
              # "v1" fields (older clients)...
              "version": version,
              "versionDate": date,
              "downloadURL": url,
              "size": asset["size"],
              # ... and "v2" format
              "versions": [{
                  "version": version,
                  "date": date,
                  "localizedDescription": desc,
                  "downloadURL": url,
                  "size": asset["size"],
                  "minOSVersion": "14.0",
              }],
          }
          source = {
              "name": "YouMod",
              "identifier": f"io.github.{owner.lower()}.youmod",
              "subtitle": "Automatic YouMod builds",
              "apps": [app],
              "news": [],
          }
          with open("out/source.json", "w") as f:
              json.dump(source, f, indent=2, ensure_ascii=False)
          print(json.dumps(source, indent=2, ensure_ascii=False))
          PY

      - name: Push source.json
        working-directory: out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git diff --cached --quiet || git commit --quiet -m "Update source ($TAG)"
          git push origin HEAD:sidestore
          echo "Source: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/sidestore/source.json" >> "$GITHUB_STEP_SUMMARY"
