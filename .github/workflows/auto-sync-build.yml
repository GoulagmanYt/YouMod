name: Auto sync upstream and build

# Merges new upstream commits into your branch, then triggers
# "Build IPA with tweaks" (ipa.yml) if anything changed.
# Tracked branch: pre-release (it must stay the repository's DEFAULT branch, otherwise the cron does not run).

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: "Rebuild even without new commits (e.g. a new base YouTube IPA)"
        type: boolean
        default: false

env:
  UPSTREAM: Tonwalter888/YouMod
  BRANCH: pre-release

concurrency:
  group: auto-sync-build
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream and trigger build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          # PAT required: GITHUB_TOKEN cannot push .github/workflows/* files
          token: ${{ secrets.GH_PAT }}

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch --quiet upstream "${BRANCH}"

          NEW=$(git rev-list --count "HEAD..upstream/${BRANCH}")
          echo "New upstream commits: $NEW"
          echo "new_commits=$NEW" >> "$GITHUB_OUTPUT"

          if [ "$NEW" -gt 0 ]; then
            if ! git merge --no-edit "upstream/${BRANCH}"; then
              git merge --abort
              echo "::error::Merge conflict with upstream/${BRANCH}: resolve it manually."
              exit 1
            fi
            git push origin "HEAD:${BRANCH}"
          fi

      - name: Trigger IPA build
        if: ${{ steps.merge.outputs.new_commits != '0' || inputs.force_build }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          # Without this, gh picks the "upstream" remote (Tonwalter888/YouMod) -> 403 error
          GH_REPO: ${{ github.repository }}
          IPA_URL: ${{ secrets.IPA_URL }}
        run: |
          test -n "$IPA_URL" || { echo "::error::Missing IPA_URL secret"; exit 1; }
          gh workflow run ipa.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" \
            -f repo="$GITHUB_REPOSITORY" \
            -f branch="$BRANCH" \
            -f ipa_url="$IPA_URL"
