name: Auto rerun Build check

# Relance automatiquement les jobs en échec de "Build check" (max 2 relances).
# Utile quand le runner macOS n'est pas obtenu ("job was not acquired by Runner").
# À placer dans .github/workflows/ sur la branche par défaut (pre-release).

on:
  workflow_run:
    workflows: ["Build check"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    steps:
      - name: Rerun failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --failed || gh run rerun "$RUN_ID"
